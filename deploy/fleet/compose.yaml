# Separate opt-in project. Never combine this file with the standalone compose.yaml.
name: lobby-goblin-fleet-${FLEET_ID:?Run Fleet.ps1 or Fleet.sh first}
services:
  docker-broker:
    image: ${FLEET_IMAGE:-ghcr.io/jkenneydaniel/lobby-goblin:0.3.10-alpha}
    container_name: lobby-goblin-docker-broker-${FLEET_ID}
    user: '0:0'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    network_mode: none
    tmpfs: [/tmp]
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
      io.lobby-goblin.role: docker-broker
    environment:
      MODE: docker-broker
      FLEET_ID: ${FLEET_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - broker-state:/broker-state
      - broker-transport:/broker-transport
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  fleet-controller:
    image: ${FLEET_IMAGE:-ghcr.io/jkenneydaniel/lobby-goblin:0.3.10-alpha}
    build: ./panel
    container_name: lobby-goblin-host-${FLEET_ID}
    user: '0:0'
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 1
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
      io.lobby-goblin.role: host-controller
    environment:
      MODE: fleet-controller
      PORT: '8091'
      FLEET_ID: ${FLEET_ID}
      DOCKER_BROKER_SOCKET: /broker/socket/docker.sock
      DOCKER_BROKER_TOKEN_FILE: /broker/credential/token
      FLEET_BROKER_VOLUME: lobby-goblin-fleet-${FLEET_ID}-broker-transport
      FLEET_IMAGE: ${FLEET_IMAGE:-ghcr.io/jkenneydaniel/lobby-goblin:0.3.10-alpha}
      FLEET_HOST_CONTAINER: lobby-goblin-host-${FLEET_ID}
      FLEET_STATE_VOLUME: lobby-goblin-fleet-${FLEET_ID}-state
      FLEET_LIBRARY_VOLUME: lobby-goblin-fleet-${FLEET_ID}-library
      FLEET_PANEL_URL: http://${FLEET_ADDRESS:-localhost}:${FLEET_PANEL_PORT:-8082}
      FLEET_GAME_ADDRESS: ${FLEET_ADDRESS:-localhost}
      FLEET_GAME_BIND: ${FLEET_GAME_BIND:-0.0.0.0}
      FLEET_MEMORY_GIB: ${FLEET_MEMORY_GIB:-16}
      FLEET_GAME_PORT_BASE: ${FLEET_GAME_PORT_BASE:-35000}
    volumes:
      - type: volume
        source: broker-transport
        target: /broker/socket
        read_only: true
        volume: {subpath: socket, nocopy: true}
      - type: volume
        source: broker-transport
        target: /broker/credential
        read_only: true
        volume: {subpath: host, nocopy: true}
      - fleet-state:/fleet
      - fleet-library:/library
      - fleet-web:/web-state
    depends_on:
      docker-broker: {condition: service_healthy}
    networks: [management]
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  fleet-web:
    image: ${FLEET_IMAGE:-ghcr.io/jkenneydaniel/lobby-goblin:0.3.10-alpha}
    container_name: lobby-goblin-host-web-${FLEET_ID}
    user: '0:0'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 0.5
    tmpfs: [/tmp]
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
      io.lobby-goblin.role: host-web
    environment:
      MODE: fleet-web
      PORT: '8080'
      AUTH_DIR: /web-state/auth
      CONTROLLER_TOKEN_FILE: /web-state/secrets/controller-token
      CONTROLLER_URL: http://fleet-controller:8091
      PANEL_HOSTS: ${FLEET_ADDRESS:-localhost},localhost,127.0.0.1
      RELEASE_CHECKS: 'false'
    ports:
      - '${FLEET_PANEL_BIND:-0.0.0.0}:${FLEET_PANEL_PORT:-8082}:8080/tcp'
    volumes:
      - fleet-web:/web-state
    depends_on:
      fleet-controller: {condition: service_healthy}
    networks: [management]
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
networks:
  management:
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
volumes:
  fleet-state:
    name: lobby-goblin-fleet-${FLEET_ID}-state
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
  fleet-library:
    name: lobby-goblin-fleet-${FLEET_ID}-library
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
  fleet-web:
    name: lobby-goblin-fleet-${FLEET_ID}-web
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
  broker-state:
    name: lobby-goblin-fleet-${FLEET_ID}-broker-state
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
      io.lobby-goblin.role: broker-state
  broker-transport:
    name: lobby-goblin-fleet-${FLEET_ID}-broker-transport
    labels:
      io.lobby-goblin.fleet: ${FLEET_ID}
      io.lobby-goblin.role: broker-transport
