name: Factorio offline export acceptance
on:
  push:
    paths: ['panel/test/factorio-map-acceptance.mjs', 'panel/applications/factorio/**', 'panel/map*.lua', '.github/workflows/factorio-offline-export.yml']
  pull_request:
    paths: ['panel/test/factorio-map-acceptance.mjs', 'panel/applications/factorio/**', 'panel/map*.lua', '.github/workflows/factorio-offline-export.yml']
permissions:
  contents: read
jobs:
  offline-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['2.0.77', '2.1.23']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify one-shot exports using only freshly generated fixture worlds
        env:
          FACTORIO_OFFLINE_DISPOSABLE: 'true'
          PROBE_FACTORIO_VERSION: ${{ matrix.version }}
        run: node panel/test/factorio-map-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-export-${{ matrix.version }}
          path: output/offline-probe
          retention-days: 7
