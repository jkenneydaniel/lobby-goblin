name: Lobby Goblin application images
on:
  push:
    paths: ['panel/applications/**', 'panel/core/**', 'panel/source-layout.js', 'tools/application-images.mjs', 'tools/factorio-image.mjs', '.github/workflows/game-images.yml', 'panel/update-worker.js', 'panel/test/image-acceptance*', 'panel/test/package-image-acceptance.mjs', 'panel/test/container-runtime-acceptance.mjs']
  pull_request:
    paths: ['panel/applications/**', 'panel/core/**', 'panel/source-layout.js', 'tools/application-images.mjs', 'tools/factorio-image.mjs', '.github/workflows/game-images.yml', 'panel/update-worker.js', 'panel/test/image-acceptance*', 'panel/test/package-image-acceptance.mjs', 'panel/test/container-runtime-acceptance.mjs']
  workflow_dispatch:
    inputs:
      image:
        description: Application/image from the package catalogue, or all
        required: true
        default: all
        type: string
      publish:
        description: Publish tested immutable images (does not deploy applications)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: application-images
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalogue.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: catalogue
        env:
          SELECTED_IMAGE: ${{ inputs.image }}
        run: |
          if [ -z "$SELECTED_IMAGE" ] || [ "$SELECTED_IMAGE" = all ]; then
            echo "matrix=$(node tools/application-images.mjs matrix)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(node tools/application-images.mjs matrix "$SELECTED_IMAGE")" >> "$GITHUB_OUTPUT"
          fi
  image:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - run: npm ci --prefix panel --ignore-scripts --no-audit --no-fund
      - name: Check package-owned sources
        env:
          IMAGE_KEY: ${{ matrix.key }}
        run: node tools/application-images.mjs check "$IMAGE_KEY"
      - name: Build an allowlisted isolated context
        env:
          IMAGE_KEY: ${{ matrix.key }}
        run: node tools/application-images.mjs build "$IMAGE_KEY"
      - name: Run package-owned native acceptance
        env:
          IMAGE_KEY: ${{ matrix.key }}
        run: node tools/application-images.mjs acceptance "$IMAGE_KEY"
      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'jkenneydaniel/lobby-goblin'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing tags before deliberate publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'jkenneydaniel/lobby-goblin'
        env:
          IMAGE_TAG: ${{ matrix.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_TAG" > /tmp/existing-image 2> /tmp/image-error; then
            echo 'This tag already exists. Increment the package image revision.'
            exit 1
          fi
          if ! grep -qi 'manifest unknown\|not found' /tmp/image-error; then
            cat /tmp/image-error
            exit 1
          fi
          docker push "$IMAGE_TAG"
