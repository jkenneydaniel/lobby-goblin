name: Package alpha release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  runtime-image:
    uses: ./.github/workflows/panel-image.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write
  package:
    needs: runtime-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Verify tag matches tested package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; if(process.env.RELEASE_TAG!=='v'+JSON.parse(fs.readFileSync('panel/package.json')).version) process.exit(1)"
      - name: Install locked runtime dependencies
        run: npm ci --prefix panel --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix panel
      - run: docker compose --project-directory . --env-file deploy/fleet/.env.example -f deploy/fleet/compose.yaml config --quiet
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t ghcr.io/jkenneydaniel/lobby-goblin:0.3.14-alpha panel
      - name: Require published application images before attaching release assets
        run: |
          docker run --rm --network none --user 0:0 \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --entrypoint node ghcr.io/jkenneydaniel/lobby-goblin:0.3.14-alpha --input-type=module -e '
              import {docker} from "./core/docker.js";
              import {verifyPublishedApplicationImages} from "./core/published-application-images.js";
              import {runtimeImagePolicy} from "./applications/factorio/runtime.js";
              const images=await verifyPublishedApplicationImages(docker,{additionalPolicies:[runtimeImagePolicy]});
              for (const image of images) console.log(image.id+" published image verified");
            '
      - name: Verify updater registry TLS and a build inside its restricted container
        run: |
          docker run --rm --user 0:0 --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --security-opt no-new-privileges:true --memory 1536m \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            --mount "type=bind,source=$PWD/panel,target=/source,readonly" \
            --entrypoint /bin/sh ghcr.io/jkenneydaniel/lobby-goblin:0.3.14-alpha -ec '
              export DOCKER_HOST=unix:///var/run/docker.sock DOCKER_CONFIG=/tmp/lobby-goblin-docker
              docker manifest inspect docker:29.9.0-cli >/dev/null
              docker build --pull --progress=plain --tag local/lobby-goblin:updater-smoke /source
            '
      - run: node tools/release.mjs
      - name: Test the packaged installer before attaching download assets
        run: |
          docker run --rm --network none --user 0:0 --read-only \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --mount "type=bind,source=$PWD/dist,target=/release,readonly" \
            --mount "type=bind,source=$PWD/panel/test/installer-image-smoke.js,target=/installer-image-smoke.mjs,readonly" \
            --entrypoint node ghcr.io/jkenneydaniel/lobby-goblin:0.3.14-alpha /installer-image-smoke.mjs
      - name: Attach source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/*.manifest.txt dist/*.update.json
