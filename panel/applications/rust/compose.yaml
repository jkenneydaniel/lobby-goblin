# Copy this template through setup.js into a NEW dedicated installation.
name: lobby-goblin-rust-${RUST_INSTANCE_ID:?Prepare the Rust installation first}
services:
  rust:
    image: ${RUST_IMAGE:?Select the Lobby Goblin rust-server image}
    platform: linux/amd64
    container_name: lobby-goblin-rust-${RUST_INSTANCE_ID}
    restart: unless-stopped
    stop_grace_period: 5m
    labels:
      io.lobby-goblin.game: rust
      io.lobby-goblin.instance: ${RUST_INSTANCE_ID}
    env_file: rust.env
    environment:
      RUST_SERVER_IDENTITY: lobby-goblin-rust
      RUST_SERVER_PORT: '28015'
      RUST_SERVER_QUERYPORT: '28017'
      RUST_RCON_PORT: '28016'
    ports:
      - '${RUST_GAME_BIND:-0.0.0.0}:${RUST_GAME_PORT:-28015}:28015/udp'
      - '${RUST_GAME_BIND:-0.0.0.0}:${RUST_QUERY_PORT:-28017}:28017/udp'
    volumes:
      - ./data:/steamcmd/rust
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [rust-private]
  controller:
    build: ./panel
    image: ${PANEL_IMAGE:-ghcr.io/jkenneydaniel/lobby-goblin:0.3.10-alpha}
    container_name: lobby-goblin-rust-controller-${RUST_INSTANCE_ID}
    user: '0:0'
    restart: unless-stopped
    environment:
      MODE: controller
      GAME_MODULE: rust
      PORT: '8081'
      CONTROLLER_TOKEN_FILE: /run/secrets/controller_token
      RUST_INSTANCE_ID: ${RUST_INSTANCE_ID}
      RUST_CONTAINER: lobby-goblin-rust-${RUST_INSTANCE_ID}
      RUST_IMAGE: ${RUST_IMAGE}
      RUST_HOST_DATA: ${RUST_HOST_DATA}
      RUST_INSTALL_ROOT: /rust-installation
      RUST_GAME_ADDRESS: ${RUST_GAME_ADDRESS:-localhost:28015}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/server:/rust-server
      - ./data:/rust-installation
      - ./control/controller:/rust-state
      - ./backups:/rust-backups
      - ./control/secrets/controller-token:/run/secrets/controller_token:ro
      - ./control/secrets/rust-rcon-password:/run/secrets/rust_rcon_password:ro
    networks: [rust-private]
  panel:
    build: ./panel
    image: ${PANEL_IMAGE:-ghcr.io/jkenneydaniel/lobby-goblin:0.3.10-alpha}
    container_name: lobby-goblin-rust-panel-${RUST_INSTANCE_ID}
    user: '${PANEL_UID:-1000}:${PANEL_GID:-1000}'
    restart: unless-stopped
    environment:
      GAME_MODULE: rust
      PORT: '8080'
      CONTROLLER_URL: http://controller:8081
      CONTROLLER_TOKEN_FILE: /run/secrets/controller_token
      PANEL_HOSTS: ${RUST_PANEL_HOSTS:-localhost,127.0.0.1}
      AUTH_DIR: /auth
      RELEASE_CHECKS: 'false'
    ports:
      - '${RUST_PANEL_BIND:-127.0.0.1}:${RUST_PANEL_PORT:-8088}:8080'
    volumes:
      - ./control/auth:/auth
      - ./control/secrets/controller-token:/run/secrets/controller_token:ro
    networks: [rust-private]
networks:
  rust-private: {}
